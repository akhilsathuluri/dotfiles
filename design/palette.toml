# Palette - the single source of truth for the terminal design language.
#
# Every themed surface in this environment derives from these values. See ./README.md for what each
# semantic role means and ./theme-switcher.md for how a switcher turns a theme name into per-tool
# config. Editing a value here is the ONLY place a color should change; nothing downstream hardcodes.
#
# Roles (see README "Foundations · Color"):
#   bg surface selection border   - surfaces & structure
#   fg emphasis muted             - content
#   accent                        - the one interactive/identity hue
#   changes                       - review surfaces: the changes chip, MR glyph, diff menu
#   float                         - a floating pane's border: a layer over the work, not a pane in it
#   working asking blocked done   - the agent-state language (idle reuses `muted`)
#   add remove                    - diff tints
#
# Solarized Light/Dark share the eight accent hues and only swap base tones, so accent + the four
# state colors are identical across the two - the mood change lives in bg/surface/text.
#
# Catppuccin Mocha Black is Mocha with the indigo taken out of the ground: identical content and
# accent hues, but bg/surface/selection/border are neutral greys (R=G=B). Mocha's #1e1e2e carries
# blue 16 points above red/green, and it is already Catppuccin's darkest - Macchiato and Frappe are
# lighter AND bluer - so a black Catppuccin has to come from here rather than from another flavor.

[meta]
default = "solarized-dark"
order = ["solarized-dark", "solarized-light", "catppuccin-latte", "catppuccin-mocha", "catppuccin-mocha-black"]

[themes.solarized-light]
name      = "Solarized Light"
mode      = "light"
bg        = "#fdf6e3"
surface   = "#eee8d5"
selection = "#eee8d5"
border    = "#cabf9e"
fg        = "#657b83"
emphasis  = "#586e75"
muted     = "#93a1a1"
accent    = "#268bd2"
changes   = "#6c71c4"
float     = "#d33682"
working   = "#2aa198"
asking    = "#b58900"
blocked   = "#dc322f"
done      = "#859900"
add       = "#d8f0d8"
remove    = "#f5d6d3"

[themes.solarized-dark]
name      = "Solarized Dark"
mode      = "dark"
bg        = "#002b36"
surface   = "#073642"
selection = "#073642"
